# Production-like stack, mirroring the GCP Cloud Run deploy (deploy/gcp/deploy.sh):
#   app + file-server-mcp + memory-server-mcp. Postgres is Supabase (DATABASE_URL), the LLM is Ollama Cloud (Groq fallback),
#   and TLS comes from the host (Cloud Run), so there is no caddy, ollama or postgres container.
#
#   docker compose -f docker-compose.prod.yml --env-file learning_coach/.env up -d --build
#   open http://localhost:8000
services:
  app:
    build: { context: ., dockerfile: learning_coach/Dockerfile }
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to the Supabase session pooler URL}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:?set OLLAMA_API_KEY (https://ollama.com/settings/keys)}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gpt-oss:120b}
      FALLBACK_LLM_PROVIDER: ${FALLBACK_LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CHECKPOINT_DB: data/checkpoints.db
      NOTES_PATH: study_materials/sample_notes
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://us.cloud.langfuse.com}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      # Quiz A2A service and CrewAI study buddy are not deployed: the in-process paths are used instead.
      USE_A2A_QUIZ: "false"
      USE_STUDY_BUDDY: "false"
      QUIZ_SERVICE_URL: http://unused:9001
      STUDY_BUDDY_URL: http://unused:9002
      MCP_FILESYSTEM_URL: http://file-server-mcp:8001/mcp
      MCP_MEMORY_URL: http://memory-server-mcp:8002/mcp
      CHAINLIT_AUTH_SECRET: ${CHAINLIT_AUTH_SECRET:?set CHAINLIT_AUTH_SECRET}
      DAILY_GOAL_LIMIT: ${DAILY_GOAL_LIMIT:-5}
      LOG_LEVEL: INFO
    depends_on: [file-server-mcp, memory-server-mcp]
    restart: unless-stopped

  file-server-mcp:
    build: { context: ., dockerfile: mcp_servers/file_server_mcp/Dockerfile }
    restart: unless-stopped

  memory-server-mcp:
    build: { context: ., dockerfile: mcp_servers/memory_server_mcp/Dockerfile }
    restart: unless-stopped
