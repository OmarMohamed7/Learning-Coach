
#   cp .env.prod.example .env.prod && edit it
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
services:
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
    restart: unless-stopped

  app:
    build: { context: ., dockerfile: learning_coach/Dockerfile }
    environment: &app_env
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/learning_coach_db
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_BASE_URL: http://ollama:11434
      CHECKPOINT_DB: data/checkpoints.db
      NOTES_PATH: study_materials/sample_notes
      LANGFUSE_HOST: ${LANGFUSE_HOST}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      QUIZ_SERVICE_URL: http://quiz-service:9001
      STUDY_BUDDY_URL: http://crewai-service:9002
      USE_A2A_QUIZ: "true"
      USE_STUDY_BUDDY: "true"
      MCP_FILESYSTEM_URL: http://file-server-mcp:8001/mcp
      MCP_MEMORY_URL: http://memory-server-mcp:8002/mcp
      CHAINLIT_AUTH_SECRET: ${CHAINLIT_AUTH_SECRET}
      LOG_LEVEL: INFO
    depends_on:
      postgres: { condition: service_healthy }
      ollama: { condition: service_started }
      file-server-mcp: { condition: service_started }
      memory-server-mcp: { condition: service_started }
    restart: unless-stopped

  quiz-service:
    build: { context: ., dockerfile: learning_coach/Dockerfile }
    command: ["python", "-m", "src.a2a_services.quiz_service"]
    environment:
      <<: *app_env
    depends_on: [ollama]
    restart: unless-stopped

  file-server-mcp:
    build: { context: ., dockerfile: mcp_servers/file_server_mcp/Dockerfile }
    volumes:
      - ./learning_coach/study_materials/sample_notes:/app/study_materials/sample_notes
    restart: unless-stopped

  memory-server-mcp:
    build: { context: ., dockerfile: mcp_servers/memory_server_mcp/Dockerfile }
    restart: unless-stopped

  crewai-service:
    build: { context: ., dockerfile: crewai_service/Dockerfile }
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_BASE_URL: http://ollama:11434
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes: [ollama_data:/root/.ollama]
    environment:
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_NUM_PARALLEL: "2"
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: learning_coach_db
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learning_coach_db"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  caddy_data:
  ollama_data:
  postgres_data:
