[project]
name = "learning-coach"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # ── Core agent framework ──────────────────────────────────────────────────
    "langgraph==1.1.0",
    "langgraph-checkpoint-sqlite==3.0.3",
    "langchain-core==1.6.3",
    "langchain-ollama==1.0.0",
    # ── MCP protocol ─────────────────────────────────────────────────────────
    "mcp==1.26.0",
    # ── A2A protocol ─────────────────────────────────────────────────────────
    "a2a-sdk==0.3.25",
    # ── Cross-framework interop ───────────────────────────────────────────────
    "crewai==1.13.0",
    # ── Observability ─────────────────────────────────────────────────────────
    "langfuse==4.0.1",
    # ── Evaluation ────────────────────────────────────────────────────────────
    "deepeval==3.9.1",
    # ── LLM gateway ───────────────────────────────────────────────────────────
    "litellm==1.82.4",
    # ── HTTP and API utilities ────────────────────────────────────────────────
    "openai==2.8.0",
    "httpx==0.28.1",
    "fastapi==0.115.0",
    "uvicorn==0.34.0",
    "streamlit==1.43.2",
    # ── Data and utilities ────────────────────────────────────────────────────
    "pydantic==2.11.9",
    "python-dotenv==1.1.1",
    "tenacity==8.5.0",
    "lancedb==0.29.2",
    # ── Shared logging (local package, also used by mcp_servers) ─────────────
    "logger-lib",
    "langchain-mcp-adapters>=0.3.0",
]

[tool.uv.sources]
logger-lib = { path = "../logger_lib", editable = true }

[project.optional-dependencies]
test = [
    # ── Testing ───────────────────────────────────────────────────────────────
    "pytest==8.3.0",
    "pytest-asyncio==0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/agents",
    "src/graph",
    "src/a2a_services",
    "src/crewai_agent",
    "src/observability",
    "src/config",
    "src/mcp_client",
]
