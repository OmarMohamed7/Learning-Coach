[project]
name = "learning-coach"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    # ── Core agent framework ──────────────────────────────────────────────────
    "langgraph>=1.1.0",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "langchain-core>=1.6.3",
    "langchain-ollama>=1.0.0",
    # ── MCP protocol ─────────────────────────────────────────────────────────
    "mcp>=1.28.1,<2",
    # ── A2A protocol ─────────────────────────────────────────────────────────
    "a2a-sdk>=0.3.25,<1",
    # ── Observability ─────────────────────────────────────────────────────────
    "langfuse>=4.15",
    # ── Evaluation ────────────────────────────────────────────────────────────
    "deepeval>=3.9.1",
    # ── LLM gateway ───────────────────────────────────────────────────────────
    "litellm>=1.82.4",
    # ── HTTP and API utilities ────────────────────────────────────────────────
    "httpx>=0.28.1",
    "uvicorn>=0.54.0",
    "streamlit>=1.43.2",
    # ── Data and utilities ────────────────────────────────────────────────────
    "pydantic>=2.12.0",
    "python-dotenv>=1.2.3",
    "tenacity>=8.5.0",
    "lancedb>=0.29.2",
    "sqlalchemy",
    "asyncpg",
    "greenlet",
    "langgraph-checkpoint-postgres",
    "psycopg[binary,pool]",
    # ── Saving Graph Image ───────────────────────────────────────────────────
    "grandalf",
    # ── Shared logging (local package, also used by mcp_servers) ─────────────
    "logger-lib",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-anthropic>=1.7.2",
    "langchain>=1.2.11",
    # ─── UI ──────────────────────────────────────────────────────────────────
    "chainlit>=2.12.0",
    "argon2-cffi>=23.1.0",
    "langchain-openai>=1.6.6",
]

[tool.uv.sources]
logger-lib = { workspace = true }

[project.optional-dependencies]
test = [
    # ── Testing ───────────────────────────────────────────────────────────────
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/agents",
    "src/graph",
    "src/a2a_services",
    "src/crewai_agent",
    "src/observability",
    "src/config",
    "src/mcp_client",
]
